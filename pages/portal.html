<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martinus Rail Chile - Portal Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Header -->
    <div id="header"></div>

    <!-- texto de bienvenida y explicación breve -->
    <section id="welcome-text">
        <h2>Bienvenido al Portal de Martinus Rail Chile</h2>
        <p>Aquí podrá explorar recursos y herramientas para la gestión de la empresa.</p>
    </section>

    <!-- Botones de enlace a PowerBI y a Sharepoint -->
    <section id="button-links">
        <div class="d-flex justify-content-center gap-3">
            <a href="https://app.powerbi.com/view?r=eyJrIjoiNzhjNTdmZDMtYWJlYy00YmUyLWIwM2YtNGRlMmUzMThlMjMyIiwidCI6ImMyOTExZWZlLWU1NTEtNGMyYy1iYTM5LTljNmQ1M2Q0MDc0NSJ9&pageName=ab47ab95e06b21c906c9" target="_blank" class="btn btn-primary">Ir a PowerBI</a>
            <a href="https://martinus365.sharepoint.com/teams/GerenciaTcnica" target="_blank" class="btn btn-secondary">Ir a SharePoint</a>
        </div>
    </section>

    <!-- Organigrama de la empresa -->
    <section id="org-chart">
        <div class="container mt-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Organigrama de la Empresa</h3>
                <button id="toggle-all" class="btn btn-primary">Mostrar todo</button>
            </div>
            <div id="organigrama-panel">
                <div id="organigrama">
                    <svg id="organigrama-lines"></svg>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="/js/components.js"></script>
    <script src="/js/organigrama.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
